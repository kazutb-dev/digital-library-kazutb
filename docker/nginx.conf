server {
    listen 80;
    server_name elibrary.kaztbu.edu.kz kaztbu.edu.kz *.kaztbu.edu.kz _;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elibrary.kaztbu.edu.kz kaztbu.edu.kz *.kaztbu.edu.kz _;
    server_tokens off;
    root /app/public;
    index index.php;

    ssl_certificate /app/ssl/fullchain.pem;
    ssl_certificate_key /app/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    keepalive_timeout 65;
    keepalive_requests 1000;

    client_max_body_size 50M;
    proxy_read_timeout 120;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;

    # Vite fingerprints every production asset filename. Long-lived immutable
    # caching therefore cannot serve stale code and removes repeat transfers of
    # the 1.3 MB application bundle.
    location ^~ /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The bundled mime.types has no entry for .mjs, so it would go out as
    # application/octet-stream — and a browser refuses to evaluate a
    # `<script type="module">` served with a non-JavaScript MIME type. The
    # digital reader loads pdf.js as an ES module, so it needs this.
    #
    # Scoped to a location on purpose: a `types` block at server level would
    # replace the inherited mime map wholesale rather than add to it, leaving
    # every stylesheet and image untyped.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # PHP via FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_keep_conn on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        # Preserve the external port so Laravel generates correct asset URLs.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
