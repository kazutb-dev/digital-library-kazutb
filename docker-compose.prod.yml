# ──────────────────────────────────────────────────────────────
#  Digital Library — Docker Compose PROD (production)
#  Usage: docker compose -f docker-compose.prod.yml up --build -d
#  WARNING: Set all secrets via environment variables or .env.prod
# ──────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # Do NOT expose port to host in production
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel App (nginx + php-fpm) — PROD mode ───────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-library-app}:${APP_VERSION:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Digital Library}"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?Set APP_URL}"
      APP_LIVE_SYNC: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-error}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: "${POSTGRES_DB}"
      DB_USERNAME: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: database
      EXTERNAL_AUTH_LOGIN_URL: "${EXTERNAL_AUTH_LOGIN_URL:?Set EXTERNAL_AUTH_LOGIN_URL}"
      EXTERNAL_AUTH_DEVICE_NAME: "${EXTERNAL_AUTH_DEVICE_NAME:-web}"
    ports:
      - "0.0.0.0:${APP_PORT:-80}:80"
    # In production: no bind-mount; image contains baked assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/api/v1/catalog-db?limit=1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_prod_data:
    name: library_prod_postgres_data
